name: mobile_dev_hassan
description: "mobile dev hassan portfolio"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.3
  toastification: ^3.2.0
  go_router: ^17.4.0
  flutter_riverpod: ^3.2.1
  logger: ^2.7.0
  url_launcher: ^6.3.2
  skeletonizer: ^2.1.3
  animate_do: ^5.1.0
  timeline_list: ^0.1.1
  animated_text_kit: ^4.3.0
  flutter_svg: ^2.3.0
  flutter_staggered_grid_view: ^0.7.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/
    - assets/icons/svg/
    - assets/files/
    - assets/images/
    - assets/images/projects/
    - assets/logos/
    - assets/fonts/Antonio/
    - assets/fonts/Inter/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Thin.woff2
          weight: 100
        - asset: assets/fonts/Inter/Inter-ExtraLight.woff2
          weight: 200
        - asset: assets/fonts/Inter/Inter-Light.woff2
          weight: 300
        - asset: assets/fonts/Inter/Inter-Regular.woff2
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.woff2
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.woff2
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.woff2
          weight: 700
        - asset: assets/fonts/Inter/Inter-ExtraBold.woff2
          weight: 800
        - asset: assets/fonts/Inter/Inter-Black.woff2
          weight: 900

    - family: Antonio
      fonts:
        - asset: assets/fonts/Antonio/Antonio-Thin.woff2
          weight: 100
        - asset: assets/fonts/Antonio/Antonio-ExtraLight.woff2
          weight: 200
        - asset: assets/fonts/Antonio/Antonio-Light.woff2
          weight: 300
        - asset: assets/fonts/Antonio/Antonio-Regular.woff2
          weight: 400
        - asset: assets/fonts/Antonio/Antonio-Medium.woff2
          weight: 500
        - asset: assets/fonts/Antonio/Antonio-SemiBold.woff2
          weight: 600
        - asset: assets/fonts/Antonio/Antonio-Bold.woff2
          weight: 700

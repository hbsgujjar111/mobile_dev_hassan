            ],
            "description": "Senior Flutter Developer specializing in high-performance, responsive cross-platform mobile application development with Flutter & Dart."
        }
    </script>

    <!-- Dynamic SEO & Experience Calculation Script (Smooth fallback overwrite) -->
    <script>
        (function() {
            // Your career start date (February 2021)
            const startDate = new Date('2021-02-01');
            const currentDate = new Date();

            // Calculate fractional years (e.g., 5.5, 5.8)
            const diffInMs = currentDate - startDate;
            const msInYear = 1000 * 60 * 60 * 24 * 365.25; // Accounting for leap years
            const yearsOfExp = (diffInMs / msInYear).toFixed(1);

            const titleText = "Hassan Bin Salim | Senior Flutter Developer";
            const descText = "Senior Flutter Developer with " + yearsOfExp + "+ years of experience building scalable, high-performance cross-platform mobile applications.";

            const imageUrl = window.location.origin + window.location.pathname + "preview.png";

            // Helper function to update meta tags dynamically for clients with JS enabled
            function setMeta(attribute, nameOrProperty, value) {
                const selector = `meta[${attribute}="${nameOrProperty}"]`;
                let meta = document.querySelector(selector);
                if (!meta) {
                    meta = document.createElement('meta');
                    meta.setAttribute(attribute, nameOrProperty);
                    document.head.appendChild(meta);
                }
                meta.setAttribute('content', value);
            }

            // Set DOM Title
            document.title = titleText;

            // Update standard SEO
            setMeta('name', 'title', titleText);
            setMeta('name', 'description', descText);

            // Update OpenGraph (Facebook, LinkedIn, WhatsApp)
            setMeta('property', 'og:url', window.location.href);
            setMeta('property', 'og:title', titleText);
            setMeta('property', 'og:description', descText);
            setMeta('property', 'og:image', imageUrl);

            // Update Twitter Cards
            setMeta('name', 'twitter:url', window.location.href);
            setMeta('name', 'twitter:title', titleText);
            setMeta('name', 'twitter:description', descText);
            setMeta('name', 'twitter:image', imageUrl);
        })();
    </script>

    <!-- Add Lottie Web -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.9/lottie.min.js"></script>

    <!-- Splash screen styling -->
    <style>
        body {
          margin: 0;
          overflow: hidden;
          background-color: #ffffff;
        }

        /* Modern, centered splash screen */
        #splash-screen {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          z-index: 9999;
          transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          background-color: #FFFFFF; /* Light mode */
        }

        #lottie-container {
          width: 250px;
          height: 250px;
        }

        /* Dark Mode Support */
        @media (prefers-color-scheme: dark) {
          #splash-screen {
            background-color: #1A1A1B;
          }
        }
    </style>
</head>
<body>

<!-- 7. Invisible H1 tag for SEO Web Spiders -->
<h1 style="display:none;">Hassan Bin Salim | Senior Flutter Developer Portfolio</h1>

<!-- Splash screen div for Lottie -->
<div id="splash-screen">
    <div id="lottie-container"></div>
</div>

<!-- Flutter app script (Standard, safe initialization for Flutter 3.22+) -->
<script src="flutter_bootstrap.js" async></script>

<!-- Lottie animation & Clean Flutter synchronization -->
<script>
    const assetPath = 'assets/assets/animations/splash.json';

    // 1. Load the Lottie Animation immediately
    const animation = lottie.loadAnimation({
      container: document.getElementById('lottie-container'),
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: assetPath
    });

    // Helper function to smoothly fade out and remove the splash screen
    function removeSplashScreen() {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.remove();
        }, 300);
      }
    }

    // 2. Hide splash screen immediately when Flutter draws the first frame
    window.addEventListener('flutter-first-frame', function () {
      removeSplashScreen();
    });

    // 3. Fallback Safety Timer (In case of catastrophic network failure)
    setTimeout(() => {
      removeSplashScreen();
    }, 10000); // 10 seconds max wait time
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">

    <!-- Initial static description (Updated instantly by the script below) -->
    <meta name="description" content="Hassan Mobile Dev Portfolio">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="mobile_dev_hassan">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>Hassan Bin Salim | Senior Flutter Developer</title>
    <link rel="manifest" href="manifest.json">

    <!-- Dynamic SEO & Experience Calculation Script -->
    <script>
        (function() {
            // Your career start date (February 2021)
            const startDate = new Date('2021-02-01');
            const currentDate = new Date();

            // Calculate fractional years (e.g., 5.5, 5.8)
            const diffInMs = currentDate - startDate;
            const msInYear = 1000 * 60 * 60 * 24 * 365.25; // Accounting for leap years
            const yearsOfExp = (diffInMs / msInYear).toFixed(1);

            const titleText = "Hassan Bin Salim | Senior Flutter Developer";
            const descText = "Senior Flutter Developer with " + yearsOfExp + "+ years of experience building scalable, high-performance cross-platform mobile applications.";

            // Note: Use a relative path to the preview image in your web/assets folder
            const imageUrl = window.location.origin + window.location.pathname + "assets/assets/preview.png";

            // Helper function to update or create meta tags dynamically
            function setMeta(attribute, nameOrProperty, value) {
                const selector = `meta[${attribute}="${nameOrProperty}"]`;
                let meta = document.querySelector(selector);
                if (!meta) {
                    meta = document.createElement('meta');
                    meta.setAttribute(attribute, nameOrProperty);
                    document.head.appendChild(meta);
                }
                meta.setAttribute('content', value);
            }

            // Set DOM Title
            document.title = titleText;

            // Update standard SEO
            setMeta('name', 'title', titleText);
            setMeta('name', 'description', descText);

            // Update OpenGraph (Facebook, LinkedIn, WhatsApp)
            setMeta('property', 'og:type', 'website');
            setMeta('property', 'og:url', window.location.href);
            setMeta('property', 'og:title', titleText);
            setMeta('property', 'og:description', descText);
            setMeta('property', 'og:image', imageUrl);

            // Update Twitter Cards
            setMeta('name', 'twitter:card', 'summary_large_image');
            setMeta('name', 'twitter:url', window.location.href);
            setMeta('name', 'twitter:title', titleText);
            setMeta('name', 'twitter:description', descText);
            setMeta('name', 'twitter:image', imageUrl);
        })();
    </script>

    <!-- Add Lottie Web -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.9/lottie.min.js"></script>

    <!-- Splash screen styling -->
    <style>
        body {
          margin: 0;
          overflow: hidden;
          background-color: #ffffff;
        }

        /* Modern, centered splash screen */
        #splash-screen {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          z-index: 9999;
          transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
          background-color: #FFFFFF; /* Light mode */
        }

        #lottie-container {
          width: 250px;
          height: 250px;
        }

        /* Dark Mode Support */
        @media (prefers-color-scheme: dark) {
          #splash-screen {
            background-color: #1A1A1B;
          }
        }
    </style>
</head>
<body>

<!-- Splash screen div for Lottie -->
<div id="splash-screen">
    <div id="lottie-container"></div>
</div>

<!-- Flutter app script (Modern initialization for Flutter 3.22+) -->
<script src="flutter_bootstrap.js" async></script>

<!-- Lottie animation & Flutter synchronization -->
<script>
    // Note the "assets/assets/" path. This is required for Release mode & GitHub Pages!
    const assetPath = 'assets/assets/animations/splash.json';

    // 1. Load the Lottie Animation immediately
    const animation = lottie.loadAnimation({
      container: document.getElementById('lottie-container'),
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: assetPath
    });

    // 2. Wait for Flutter to finish loading before hiding the splash screen
    window.addEventListener('load', function () {
      if (window._flutter && window._flutter.loader) {
        window._flutter.loader.load({
          onEntrypointLoaded: async function(engineInitializer) {
            const appRunner = await engineInitializer.initializeEngine();

            // Give Flutter an extra 200ms to render the first frame
            setTimeout(async () => {
              const splash = document.getElementById('splash-screen');

              // Start the smooth fade-out
              if (splash) splash.style.opacity = '0';

              // Actually run the Flutter app
              await appRunner.runApp();

              // Remove the splash screen from memory after the fade transition completes
              setTimeout(() => {
                if (splash) splash.remove();
              }, 600);
            }, 200);
          }
        });
      }
    });

    // 3. Fallback Safety Timer (In case the user has a bad connection and Flutter fails to load)
    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 600);
      }
    }, 10000); // 10 seconds max wait time
</script>

</body>
</html>
